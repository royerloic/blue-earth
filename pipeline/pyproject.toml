[project]
name = "blueearth-pipeline"
version = "0.1.0"
description = "Data preparation for Blue Earth (DEM, imagery, cube faces, KTX2)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
 "openexr>=3.5.2",
 "pillow>=11",
 "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blueearth_pipeline"]
